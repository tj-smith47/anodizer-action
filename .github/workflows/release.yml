name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release (and the v1 retag below) on the action manifest being
  # loadable. release.yml runs on every push to master independently of the
  # Test workflow, so without this a broken action.yml would retag the
  # floating major tag and break every consumer before any check caught it.
  validate:
    name: Validate action.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate action.yml manifest
        run: bash scripts/validate/action-manifest.sh action.yml

  release:
    name: semantic-release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Force-update the floating major tag (e.g. v1) to point at the
      # release commit. Done inline rather than in a separate
      # release:published-triggered workflow because releases created by
      # the default GITHUB_TOKEN do NOT fire downstream workflows
      # (GitHub's recursive-trigger guard). The standalone
      # update-major-tag.yml is kept for workflow_dispatch / manual
      # recovery, but the live path is this step.
      - name: Force-update major tag
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: richardsimko/update-tag@v3
        with:
          tag_name: v${{ steps.semantic.outputs.new_release_major_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
