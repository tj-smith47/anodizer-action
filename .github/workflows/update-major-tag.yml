name: Update Major Tag (manual recovery)

# The primary major-tag update path is the inline step in release.yml,
# fired after each successful release.
#
# This workflow is a manual recovery path: if a major tag (e.g. v1) is
# pointing at the wrong commit or has been deleted, an operator can
# trigger this from the Actions UI to rebuild it from current master
# HEAD.
#
# IMPORTANT: GITHUB_TOKEN (which is what this workflow uses) cannot
# create or non-fast-forward-update a tag ref to an arbitrary commit
# that the running workflow is not tied to — both POST git/refs and
# PATCH git/refs/<tag> return 403 "Resource not accessible by
# integration". The action used here (richardsimko/update-tag@v1) only
# works because GitHub allows the workflow's own GITHUB_SHA (= master
# HEAD at workflow_dispatch time) to be the tag target.
#
# So: to retarget v1 at an older release, first push a revert (or
# cherry-pick) of that release's tip to master, then trigger this
# workflow. v1 will land at the new master HEAD.

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'Major version tag to rebuild (e.g. v1)'
        required: true
        type: string
        default: 'v1'

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Rebuild major tag from master HEAD
    runs-on: ubuntu-latest
    steps:
      - name: Validate major tag shape
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          set -euo pipefail
          if [[ ! "$MAJOR" =~ ^v[0-9]+$ ]]; then
            echo "Input 'major' must be of the form vN (e.g. v1), got: $MAJOR" >&2
            exit 1
          fi
          echo "Will retarget tag $MAJOR to master HEAD."

      - name: Force-update major tag to master HEAD
        uses: richardsimko/update-tag@v3
        with:
          tag_name: ${{ inputs.major }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
