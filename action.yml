name: "Anodizer Action"
description: "GitHub Action for Anodizer — a Rust-native release automation tool"
author: "tj-smith47"
branding:
  color: "orange"
  icon: "package"

inputs:
  # ---------------------------------------------------------------------------
  # Installation source (pick one path)
  # ---------------------------------------------------------------------------
  version:
    description: >
      Anodizer version to install from GitHub releases. Accepts an exact tag
      (e.g. "v0.1.1"), the literal "latest" (newest stable release), or the
      literal "nightly" (newest release whose tag matches `*-nightly`,
      i.e. `vX.Y.Z-<sha>-nightly`). Semver ranges such as "~> v2" are NOT
      supported — pass an explicit tag, "latest", "nightly", or use
      `from-artifact` / `from-source`. Must not be combined with
      `from-artifact`, `from-source`, or `from-branch` — the action fails
      when an explicit version is set alongside any of them.
    default: "latest"
    required: false
  from-artifact:
    description: >
      Download a pre-built anodizer binary from a workflow artifact instead of
      GitHub releases. Set to the artifact name (e.g. "anodizer-linux"). For
      cross-workflow downloads, also set `artifact-run-id`.
    required: false
  artifact-run-id:
    description: >
      Workflow run ID to download the artifact from. Use "auto" to automatically
      resolve the latest successful run of `artifact-workflow` for the current
      commit. Use a numeric ID for explicit control. Omit to download from
      the current workflow run.
    required: false
  artifact-workflow:
    description: >
      Workflow filename to search when `artifact-run-id` is "auto"
      (e.g. "ci.yml"). Ignored otherwise.
    default: "ci.yml"
    required: false
  from-source:
    description: >
      Build anodizer from source in the current workdir (bootstrap mode).
      Rust is auto-installed; you do not need to also set `install-rust: true`.
      Useful when `from-artifact` is only available for one platform and the
      current runner needs a platform-native binary.
    default: "false"
    required: false
  from-branch:
    description: >
      Shallow-clone `tj-smith47/anodizer` at the given branch name and build
      it from source. Accepts a branch name only (e.g. "my-feature", "main").
      The repository is hardcoded to `tj-smith47/anodizer`; do not include an
      owner prefix, repo name, or commit SHA — branch names only. Rust is
      auto-installed. Mutually exclusive
      with `version`, `from-artifact`, and `from-source`.
    default: ""
    required: false

  # ---------------------------------------------------------------------------
  # Dependency setup
  # ---------------------------------------------------------------------------
  install:
    description: >
      Explicit comma-separated list of build/pipeline dependencies to install,
      bypassing auto-detection. Use this when the job does NOT run the pipeline
      (so `anodizer tools` has nothing to report) — e.g. a `--preflight-secrets`
      key-load check — or to force a specific tool on.
      Supported: nfpm, makeself, snapcraft, rpmbuild, cosign, syft, zig, node,
      cargo-zigbuild, upx, nsis, create-dmg, flatpak, alejandra, linuxdeploy,
      rcodesign, wix, wix3, pkgbuild, xmllint.
      `wix` is the WiX v4 dialect (`wix build`, the dotnet global tool on
      Windows); `wix3` is the WiX v3 dialect (candle+light via the choco
      wixtoolset package). Both install `wixl` (msitools) on Linux.
      Uses the platform's native package manager (apt on Linux, brew on macOS,
      choco on Windows); some deps fall back to direct downloads when no
      packaged version exists.
    required: false
  auto-install:
    description: >
      Derive and install the external tools the configured pipeline needs by
      asking the engine itself — `anodizer tools --json` — rather than
      re-parsing the config in shell (which drifts from anodizer's truth).
      The run's scope flags (`--publish-only`, `--skip`, `--publishers`,
      `-f/--config`) are read from `args` and forwarded, so the installed set
      matches exactly the stages this job runs (a publish-only job never
      installs build-only tools, and `--skip=npm` drops node). Each reported
      binary is mapped to the matching installer; tools already on PATH or
      provided by the runner (git, gpg, ssh, docker, cargo) are left alone, and
      a required tool with no install recipe is reported as a warning instead
      of being silently skipped. Set `install:` instead when the job does not
      run the pipeline.
    default: "false"
    required: false
  install-rust:
    description: "Install the stable Rust toolchain (dtolnay/rust-toolchain)."
    default: "false"
    required: false
  reclaim-disk:
    description: >
      Reclaim large, build-irrelevant runner caches before heavy
      build/packaging so disk-tight runners don't fail with "No space left on
      device" (the macOS determinism harness assembles installers twice plus
      hdiutil scratch volumes). "auto" (default) reclaims the preinstalled
      caches a Rust release pipeline never uses — iOS/tvOS/watchOS simulator
      runtimes on macOS, large preinstalled SDKs on Linux — but ONLY on
      GitHub-hosted runners; a self-hosted runner's disk is never touched.
      "true" forces reclamation on any runner; "false" disables it.
    default: "auto"
    required: false

  # ---------------------------------------------------------------------------
  # Workspace resolution (monorepo tag → crate mapping)
  # ---------------------------------------------------------------------------
  resolve-workspace:
    description: >
      Resolve the triggering tag to a crate name using `anodizer resolve-tag`.
      Set to "true" on tag-triggered release workflows. Populates the
      `workspace`, `crate-path`, and `has-builds` outputs.
    default: "false"
    required: false

  # ---------------------------------------------------------------------------
  # Docker setup (for projects using dockers_v2 in .anodizer.yaml)
  # ---------------------------------------------------------------------------
  docker-registry:
    description: >
      Container registry to log in to (e.g. "ghcr.io"). When set, the action
      logs in, and sets up QEMU + buildx for multi-platform builds.
    required: false
  docker-username:
    description: "Registry username (defaults to github.actor via GITHUB_ACTOR env)."
    required: false
  docker-password:
    description: "Registry password or token (e.g. secrets.GITHUB_TOKEN)."
    required: false

  # ---------------------------------------------------------------------------
  # Split artifact management
  # ---------------------------------------------------------------------------
  upload-dist:
    description: >
      Upload the dist tree (the configured `dist:` directory, default
      `dist/`) as a workflow artifact named "dist-$RUNNER_OS" after running
      anodizer. Set to "true" in split build jobs. With
      `preserve-dist: 'true'` it instead uploads `preserved-dist/` as
      "dist-<shard-label>", so same-OS shards on a determinism matrix
      don't collide.
    default: "false"
    required: false
  download-dist:
    description: >
      Download and merge dist-* artifacts before running anodizer. Set to "true"
      in merge jobs. Merges all artifacts matching "dist-*" into the dist tree
      (the configured `dist:` directory, default `dist/`).
    default: "false"
    required: false

  # ---------------------------------------------------------------------------
  # Key material
  # ---------------------------------------------------------------------------
  gpg-private-key:
    description: >
      GPG private key contents to import for signing. The key is piped into
      `gpg --batch --import`.
    required: false
  apk-private-key:
    description: >-
      PEM-format RSA private key for signing apk packages produced by
      nfpm. Required if your `.anodizer.yaml` configures
      `nfpm[].apk.signature` (apk-tools uses its own RSA-PSS scheme,
      not OpenPGP, so the GPG key consumed by `gpg-private-key` does
      not work here). The private key is written to a temp file with
      mode 0600 and the path is exported as `APK_PRIVATE_KEY_PATH` for
      subsequent steps and the anodizer config to consume. The matching
      public key is derived via `openssl rsa -pubout`, exported as
      `APK_PUBLIC_KEY_PATH`, and copied into `./dist/` as
      `<repo>-apk-signing-key.rsa.pub` so consumers can attach it as
      a release asset via `release.extra_files`; apk verifiers install
      that file under `/etc/apk/keys/` before `apk add`-ing a signed
      package.
    required: false
    default: ""
  cosign-key:
    description: >
      Cosign private key contents. Written to `cosign.key` in the workdir
      with mode 0600. Pair with `COSIGN_PASSWORD` in the env.
    required: false

  # ---------------------------------------------------------------------------
  # Execution
  # ---------------------------------------------------------------------------
  args:
    description: >
      Arguments to pass to anodizer (e.g. "release --snapshot"). Do NOT embed
      secrets or tokens here — this value appears in workflow logs. Pass
      secrets via the `env:` block (e.g. `GITHUB_TOKEN`, `COSIGN_PASSWORD`).
    required: false
  workdir:
    description: "Working directory (below repository root)."
    default: "."
    required: false
  install-only:
    description: "Only install anodizer without running it."
    default: "false"
    required: false

  # ---------------------------------------------------------------------------
  # Determinism harness
  # ---------------------------------------------------------------------------
  determinism:
    description: >
      Run the determinism harness (`anodizer check determinism`) on this shard.
      When true, the action: installs Rust (if not already), provisions the
      `anodizer` binary — built from source by default, or downloaded when
      `version` names an explicit tag (a consumer validating its own release
      reproducibility runs the same released binary that will publish it) —
      installs the harness dependency set (zig, cargo-zigbuild,
      upx, nfpm, makeself, snapcraft, syft, cosign on Linux; upx, syft,
      cosign on macOS/Windows), derives the configured-target CSV for the
      current RUNNER_OS via
      `anodizer targets --json`, `rustup target add`s those triples, and
      invokes the harness. Intended to be the entire body of a per-OS
      harness shard on a 3-OS matrix [ubuntu-latest, macos-latest,
      windows-latest]. Mutually exclusive with `args`.
    default: "false"
    required: false
  determinism-runs:
    description: "N for `anodizer check determinism --runs=N`."
    default: "2"
    required: false
  determinism-stages:
    description: >
      Stages to validate (comma-separated). When unset, defaults to the
      stages configured-and-installable on the current RUNNER_OS:
      Linux gets `build,source,upx,archive,nfpm,makeself,snapcraft,sbom,sign,checksum`;
      macOS and Windows get `build,source,upx,archive,sbom,sign,checksum`
      (no nfpm/makeself/snapcraft — apt is Linux-only and apk/deb/rpm
      signing isn't provisioned on the non-Linux shards). Explicit
      values override. Beyond the default set the harness also accepts
      `cargo-package`, `docker`, `msi`, `nsis`, `dmg`, `pkg`, `srpm`, and
      the `installers` family selector (expands to
      nfpm,makeself,srpm,msi,nsis,dmg,pkg).
    default: ""
    required: false
  determinism-targets:
    description: >
      Explicit target CSV override. When unset, the action filters
      `anodizer targets --json` to entries matching the current RUNNER_OS.
      Set when your shard runs on a non-standard runner label.
    required: false
  determinism-crate:
    description: >
      Scope the harness to a single workspace crate via
      `anodizer check determinism --crate <name>`. Required when the
      release workflow fans out per crate (e.g. matrix over
      `fromJson(needs.tag.outputs.crates)`) so each shard's preserved
      dist lands under its own `<crate>/` subdir for collision-free
      merge in the downstream publish job.
    default: ""
    required: false
  preserve-dist:
    description: >
      Have the determinism harness preserve its hermetic dist tree to
      `./preserved-dist/` so a downstream `release: --publish-only` job
      can publish directly from the byte-stable artifacts. Manifests
      get a `-<shard-label>` suffix (`context-<label>.json`, etc.) so
      sharded matrix uploads don't collide under `merge-multiple: true`.
      Requires `determinism: 'true'` and `shard-label`.
    default: "false"
    required: false
  shard-label:
    description: >
      Per-shard suffix appended to preserved-dist manifests. The caller
      names each shard explicitly; the action does not derive labels.
      Required when `preserve-dist: 'true'`.
    required: false
    default: ""

outputs:
  artifacts:
    description: "Build result artifacts JSON (contents of dist/artifacts.json)."
    value: ${{ steps.outputs.outputs.artifacts }}
  metadata:
    description: "Build result metadata JSON (contents of dist/metadata.json)."
    value: ${{ steps.outputs.outputs.metadata }}
  release-url:
    description: "URL of the created GitHub release (extracted from metadata.json)."
    value: ${{ steps.outputs.outputs.release-url }}
  workspace:
    description: "Crate name resolved from the triggering tag (requires resolve-workspace: true)."
    value: ${{ steps.resolve-workspace.outputs.crate }}
  crate-path:
    description: "Path to the resolved crate directory (requires resolve-workspace: true)."
    value: ${{ steps.resolve-workspace.outputs.path }}
  has-builds:
    description: "Whether the resolved crate has binary builds configured (requires resolve-workspace: true)."
    value: ${{ steps.resolve-workspace.outputs.has-builds }}
  split-matrix:
    description: >
      JSON matrix for `strategy.matrix` covering all configured build targets.
      Produced from the anodizer config when `install-only: true`. Each entry
      has `os`, `target`, and `artifact` fields.
    value: ${{ steps.split-matrix.outputs.matrix }}
  crates:
    description: >
      JSON array of crate names that `anodizer tag` produced tags for in this
      run. Empty array `[]` when nothing was tagged. Use as
      `fromJson(steps.<id>.outputs.crates)` to drive downstream matrix
      strategies.
    value: ${{ steps.outputs.outputs.crates }}
  versions:
    description: >
      JSON object mapping crate name to bumped version, from `anodizer tag`.
      Empty `{}` when nothing was tagged. Consume with
      `fromJson(steps.<id>.outputs.versions).<crate>` or bracket-form for
      hyphenated crate names: `fromJson(steps.<id>.outputs.versions)['my-crate']`.
    value: ${{ steps.outputs.outputs.versions }}
  new-tag:
    description: >
      Tag `anodizer tag` created this run (e.g. `v1.2.3`), for single-crate and
      lockstep-workspace repos. Empty when no tag was cut. Per-crate workspaces
      surface tags via `crates`/`versions` instead.
    value: ${{ steps.outputs.outputs.new-tag }}
  old-tag:
    description: "Previous tag `anodizer tag` bumped from. Empty when there was none (first release)."
    value: ${{ steps.outputs.outputs.old-tag }}
  part:
    description: "Semver part bumped by `anodizer tag`: `major` | `minor` | `patch` | `none` | `custom`."
    value: ${{ steps.outputs.outputs.part }}
  tagged:
    description: >
      `'true'` when this run cut a new tag (`new-tag` is non-empty and differs
      from `old-tag`), `'false'` on a no-op run. Gate downstream release jobs on
      this for single-crate / lockstep repos.
    value: ${{ steps.outputs.outputs.tagged }}
  head-sha:
    description: >
      Commit SHA at HEAD after `anodizer tag --push` (the tag target — the
      version-sync bump commit, or the original HEAD when no bump was needed).
      Check this out in downstream jobs so the tree matches the tag.
    value: ${{ steps.outputs.outputs.head-sha }}
  irreversibly-published:
    description: >
      `'true'` when the run's summary (`dist/run-*/summary.json`, or
      `dist/<crate>/run-*/summary.json` in per-crate workspaces) records a
      one-way-door publisher (crates.io, chocolatey, winget, snapcraft, ...)
      whose publish landed — the version is burned at a registry that never
      accepts the same version twice, so a tag rollback can only orphan the
      live release, never enable a clean same-version re-cut. `'false'` when
      only reversible publishers (github-release assets, blobs,
      tap/bucket/index commits) succeeded, or when nothing was proven
      published (including when no summary exists). Forensic signal: the
      default failure handling is anodizer's in-process `release.on_failure`
      policy, which already refuses to roll back past one-way doors. Workflows
      adding a custom destructive recovery step must gate it on this output:
      `if: steps.<id>.outputs.irreversibly-published != 'true'`.
    value: ${{ steps.outputs.outputs.irreversibly_published }}
  irreversibly_published:
    description: >
      Deprecated snake_case alias of `irreversibly-published` (same value);
      retained so existing workflows keep working. New workflows should
      read `irreversibly-published`.
    value: ${{ steps.outputs.outputs.irreversibly_published }}

runs:
  using: "composite"
  steps:
    # -------------------------------------------------------------------------
    # Platform detection
    # -------------------------------------------------------------------------
    - name: Determine platform
      id: platform
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/platform/detect.sh"

    # -------------------------------------------------------------------------
    # Install-method classifier — single source of truth for the install path
    # and the toolchain/run gating booleans, so the long `if:` conditionals
    # below collapse to `steps.plan.outputs.*` lookups. Pure input arithmetic;
    # no network or toolchain, so it runs right after platform detection and
    # ahead of every step that gates on it.
    # -------------------------------------------------------------------------
    - name: Classify install method
      id: plan
      shell: bash
      env:
        FROM_ARTIFACT: ${{ inputs.from-artifact }}
        FROM_BRANCH: ${{ inputs.from-branch }}
        FROM_SOURCE: ${{ inputs.from-source }}
        DETERMINISM: ${{ inputs.determinism }}
        VERSION: ${{ inputs.version }}
        INSTALL_RUST: ${{ inputs.install-rust }}
        INSTALL_ONLY: ${{ inputs.install-only }}
        ARGS: ${{ inputs.args }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/classify.sh"

    # -------------------------------------------------------------------------
    # Disk reclamation — runs before any toolchain/build/packaging step that
    # consumes scratch space, gated on a build actually being needed so a
    # pure install run never disturbs the runner.
    # -------------------------------------------------------------------------
    - name: Reclaim runner disk
      if: >-
        inputs.reclaim-disk == 'true' ||
        (inputs.reclaim-disk == 'auto' &&
         (steps.plan.outputs.needs_rust == 'true' || inputs.determinism == 'true' || inputs.auto-install == 'true'))
      shell: bash
      env:
        RECLAIM_DISK: ${{ inputs.reclaim-disk }}
      run: "${GITHUB_ACTION_PATH}/scripts/platform/reclaim-disk.sh"

    # -------------------------------------------------------------------------
    # Input validation
    # -------------------------------------------------------------------------
    - name: Validate determinism inputs
      if: inputs.determinism == 'true' && inputs.args != ''
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/validate/determinism-inputs.sh"

    - name: Validate install-path inputs
      if: >-
        (inputs.from-branch != '' && inputs.from-source == 'true') ||
        (inputs.from-branch != '' && inputs.from-artifact != '') ||
        (inputs.from-branch != '' && inputs.version != 'latest' && inputs.version != '') ||
        (inputs.from-source == 'true' && inputs.from-artifact != '') ||
        (inputs.from-source == 'true' && inputs.version != 'latest' && inputs.version != '') ||
        (inputs.from-artifact != '' && inputs.version != 'latest' && inputs.version != '')
      shell: bash
      env:
        FROM_BRANCH: ${{ inputs.from-branch }}
        FROM_SOURCE: ${{ inputs.from-source }}
        FROM_ARTIFACT: ${{ inputs.from-artifact }}
        VERSION: ${{ inputs.version }}
      run: "${GITHUB_ACTION_PATH}/scripts/validate/install-path.sh"

    - name: Validate preserve-dist inputs
      if: inputs.preserve-dist == 'true'
      shell: bash
      env:
        DETERMINISM: ${{ inputs.determinism }}
        SHARD_LABEL: ${{ inputs.shard-label }}
      run: "${GITHUB_ACTION_PATH}/scripts/validate/preserve-dist.sh"

    # -------------------------------------------------------------------------
    # Rust toolchain — prereq for from-source, from-branch, cargo-zigbuild,
    # and the determinism harness (which rebuilds the release repeatedly).
    # -------------------------------------------------------------------------
    - name: Install Rust toolchain
      if: steps.plan.outputs.needs_rust == 'true'
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    # Clone the from-branch tree BEFORE the cargo cache step. rust-cache runs
    # `cargo metadata` against the workspace to scope itself, so the cloned
    # Cargo.toml must already exist — otherwise the cache neither restores nor
    # saves and every from-branch build is cold (the backfill iterate loop
    # re-dispatches the same branch and depends on that reuse).
    - name: Clone anodizer branch
      if: steps.plan.outputs.install_method == 'branch'
      id: clone-branch
      shell: bash
      env:
        FROM_BRANCH: ${{ inputs.from-branch }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/from-branch.sh"

    # -------------------------------------------------------------------------
    # Cargo build cache (from-source / determinism / from-branch paths).
    # rust-cache covers Cargo.lock-stable runs; sccache covers Cargo.lock
    # churn and the determinism harness's per-run fresh worktrees (where
    # target/ is wiped between runs). Layered, not replacing.
    # -------------------------------------------------------------------------
    - name: Compute cache key suffix
      if: steps.plan.outputs.needs_cargo_cache == 'true'
      id: cache-key
      shell: bash
      env:
        DETERMINISM: ${{ inputs.determinism }}
        FROM_BRANCH: ${{ inputs.from-branch }}
        WORKSPACE_DIR: ${{ inputs.from-branch != '' && format('{0}/anodizer-src', runner.temp) || inputs.workdir }}
        # Same-OS determinism shards (the x86_64 + aarch64 Windows shards share a
        # Windows_NT-x64 host) must key distinctly or they race to save one cache.
        SHARD_LABEL: ${{ inputs.shard-label }}
      run: "${GITHUB_ACTION_PATH}/scripts/rust/cache-key.sh"

    - name: Cache cargo target dir
      if: steps.plan.outputs.needs_cargo_cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: anodizer-action-${{ steps.cache-key.outputs.suffix }}
        workspaces: ${{ inputs.from-branch != '' && format('{0}/anodizer-src', runner.temp) || inputs.workdir }}
      env:
        # rust-cache's bundled Node deps import the deprecated `punycode` core
        # module (DEP0040); its node24 runtime honors the per-code suppression so
        # genuine deprecations still surface. v2.9.1 is latest — no release drops it.
        NODE_OPTIONS: --disable-warning=DEP0040

    - name: Set up sccache
      if: steps.plan.outputs.needs_sccache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      env:
        # sccache-action's bundled Node deps import the deprecated `punycode`
        # module (DEP0040); its node24 runtime honors the per-code suppression.
        NODE_OPTIONS: --disable-warning=DEP0040

    # sccache is armed only for determinism / from-source. from-branch clones
    # a remote and builds it once per CI run with no chance of reuse, so the
    # wrapper is pure overhead AND exposes the build to Azure Storage outages
    # ("Our services aren't available right now") — every rustc call would
    # exit 101.
    - name: Enable sccache wrapper (with health probe)
      if: steps.plan.outputs.needs_sccache == 'true'
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/rust/sccache-probe.sh"

    # -------------------------------------------------------------------------
    # Install anodizer — runs BEFORE dependency auto-detection so the binary
    # exists when auto-detect-deps.sh asks `anodizer tools` what the configured
    # pipeline needs.
    #
    # Path A: from a workflow artifact.
    # -------------------------------------------------------------------------
    - name: Resolve artifact run ID
      if: steps.plan.outputs.install_method == 'artifact' && inputs.artifact-run-id != ''
      id: resolve-run
      shell: bash
      env:
        ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        ARTIFACT_WORKFLOW: ${{ inputs.artifact-workflow }}
        FROM_ARTIFACT: ${{ inputs.from-artifact }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/resolve-artifact-id.sh"

    - name: Download artifact
      if: steps.plan.outputs.install_method == 'artifact'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.from-artifact }}
        path: ${{ runner.tool_cache }}/anodizer/artifact
        github-token: ${{ inputs.artifact-run-id != '' && github.token || '' }}
        run-id: ${{ steps.resolve-run.outputs.run_id || '' }}

    - name: Install from artifact
      if: steps.plan.outputs.install_method == 'artifact'
      shell: bash
      env:
        BIN: ${{ steps.platform.outputs.bin }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/artifact.sh"

    # -------------------------------------------------------------------------
    # Installation — Path B: from GitHub release
    # -------------------------------------------------------------------------
    - name: Resolve version
      if: steps.plan.outputs.install_method == 'release'
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/resolve-version.sh"

    - name: Download release
      if: steps.plan.outputs.install_method == 'release'
      shell: bash
      env:
        TAG: ${{ steps.version.outputs.tag }}
        OS: ${{ steps.platform.outputs.os }}
        ARCH: ${{ steps.platform.outputs.arch }}
        EXT: ${{ steps.platform.outputs.ext }}
        BIN: ${{ steps.platform.outputs.bin }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/release.sh"

    # -------------------------------------------------------------------------
    # Installation — Path C: from source (bootstrap)
    # Installation — Path D: build the from-branch tree cloned above.
    #
    # The clone runs earlier (before the cargo cache) so rust-cache can scope
    # itself to the cloned tree. The build step finds it via $ANODIZER_SRC_DIR
    # (env-written by the clone step) rather than inputs.workdir, so the user's
    # checkout is never touched.
    # -------------------------------------------------------------------------
    - name: Build anodizer from source
      if: steps.plan.outputs.install_method == 'source' || steps.plan.outputs.install_method == 'branch'
      shell: bash
      working-directory: ${{ env.ANODIZER_SRC_DIR || inputs.workdir }}
      env:
        BIN: ${{ steps.platform.outputs.bin }}
        FROM_BRANCH: ${{ inputs.from-branch }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/from-source.sh"

    # -------------------------------------------------------------------------
    # Dependency installation
    # -------------------------------------------------------------------------
    - name: Auto-detect dependencies from .anodizer.yaml
      if: inputs.auto-install == 'true'
      id: auto-detect
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ANODIZER_ARGS: ${{ inputs.args }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/auto-detect-deps.sh"

    - name: Emit determinism dependency set
      if: inputs.determinism == 'true'
      id: det-deps
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/install/determinism-deps.sh"

    - name: Install dependencies
      if: inputs.install != '' || steps.auto-detect.outputs.deps != '' || steps.det-deps.outputs.deps != ''
      shell: bash
      env:
        EXPLICIT_INSTALL: ${{ inputs.install }}
        AUTO_INSTALL: ${{ steps.auto-detect.outputs.deps }}
        DETERMINISM_INSTALL: ${{ steps.det-deps.outputs.deps }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/deps.sh"

    # -------------------------------------------------------------------------
    # Key material
    # -------------------------------------------------------------------------
    - name: Import GPG private key
      if: inputs.gpg-private-key != ''
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: "${GITHUB_ACTION_PATH}/scripts/keys/gpg.sh"

    - name: Provision apk signing keys
      if: inputs.apk-private-key != ''
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        APK_PRIVATE_KEY_INPUT: ${{ inputs.apk-private-key }}
      run: "${GITHUB_ACTION_PATH}/scripts/keys/apk.sh"

    - name: Write cosign key
      if: inputs.cosign-key != ''
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        COSIGN_KEY_CONTENTS: ${{ inputs.cosign-key }}
      run: "${GITHUB_ACTION_PATH}/scripts/keys/cosign.sh"

    # -------------------------------------------------------------------------
    # Workspace resolution (monorepo tag → crate)
    # -------------------------------------------------------------------------
    - name: Resolve workspace from tag
      if: inputs.resolve-workspace == 'true' && github.ref_type == 'tag'
      id: resolve-workspace
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        TAG: ${{ github.ref_name }}
      run: "${GITHUB_ACTION_PATH}/scripts/workspace/resolve-tag.sh"

    # -------------------------------------------------------------------------
    # Docker setup (login + QEMU + buildx)
    # -------------------------------------------------------------------------
    - name: Log in to container registry
      if: inputs.docker-registry != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.docker-registry }}
        username: ${{ inputs.docker-username || github.actor }}
        password: ${{ inputs.docker-password }}

    - name: Set up QEMU
      if: inputs.docker-registry != ''
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

    # anodizer's `dockers_v2` multi-arch flow runs
    # `docker buildx build --platform linux/amd64,linux/arm64`, which the
    # default `docker` driver cannot serve (it builds only the host platform,
    # making the QEMU step above useless). A `docker-container` builder is
    # required for multi-platform builds; combined with registry push it is the
    # standard, correct multi-arch publishing configuration.
    - name: Set up Docker Buildx
      if: inputs.docker-registry != ''
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        driver: docker-container

    # -------------------------------------------------------------------------
    # Split artifact handling
    # -------------------------------------------------------------------------
    # Resolve the configured dist directory once; the artifact download /
    # upload `uses:` steps below can't source the shell resolver, so they
    # consume this step's output instead of hardcoding `dist/`.
    - name: Resolve dist directory
      if: inputs.download-dist == 'true' || inputs.upload-dist == 'true'
      id: dist
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: "${GITHUB_ACTION_PATH}/scripts/run/resolve-dist-dir.sh"

    - name: Download split artifacts
      if: inputs.download-dist == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ${{ steps.dist.outputs.path }}/
        pattern: dist-*
        merge-multiple: true

    - name: Verify split artifacts
      if: inputs.download-dist == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: "${GITHUB_ACTION_PATH}/scripts/workspace/verify-split.sh"

    - name: Produce split matrix
      if: inputs.install-only == 'true'
      id: split-matrix
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: "${GITHUB_ACTION_PATH}/scripts/workspace/split-matrix.sh"

    # -------------------------------------------------------------------------
    # Determinism harness — runs after `anodizer` is on PATH (source build or
    # pinned-release download) and after install-deps (so zig / cargo-zigbuild / upx are
    # available for the per-target rebuilds the harness drives).
    # -------------------------------------------------------------------------
    # The harness's docker stage runs `docker buildx build
    # --output=type=oci`, an exporter the default `docker` driver cannot
    # serve ("OCI exporter is not supported for the docker driver"). A
    # `docker-container` builder is required; provisioning it here means
    # consumer workflows running the determinism harness no longer need their
    # own setup-buildx-action step. Linux-only — the docker stage is skipped
    # on other runners.
    - name: Set up Docker Buildx (determinism OCI exporter)
      if: inputs.determinism == 'true' && runner.os == 'Linux'
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        driver: docker-container

    - name: Resolve determinism target CSV
      if: inputs.determinism == 'true'
      id: det-targets
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        RUNNER_OS: ${{ runner.os }}
        OVERRIDE: ${{ inputs.determinism-targets }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism/resolve-targets.sh"

    - name: Install determinism target triples
      if: inputs.determinism == 'true'
      shell: bash
      env:
        TARGETS: ${{ steps.det-targets.outputs.csv }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism/install-targets.sh"

    - name: Run determinism harness
      if: inputs.determinism == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        TARGETS: ${{ steps.det-targets.outputs.csv }}
        STAGES_INPUT: ${{ inputs.determinism-stages }}
        RUNS: ${{ inputs.determinism-runs }}
        PRESERVE_DIST: ${{ inputs.preserve-dist }}
        CRATE: ${{ inputs.determinism-crate }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism/run-harness.sh"

    - name: Rename preserved-dist manifests per shard
      if: inputs.determinism == 'true' && inputs.preserve-dist == 'true' && success()
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        SHARD_LABEL: ${{ inputs.shard-label }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism/rename-preserved-dist.sh"

    # -------------------------------------------------------------------------
    # Run anodizer
    # -------------------------------------------------------------------------
    - name: Run anodizer
      if: steps.plan.outputs.run_anodizer == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ANODIZER_ARGS: ${{ inputs.args }}
        ANODIZER_STDOUT_LOG: ${{ runner.temp }}/anodizer-stdout.log
        # The npm publisher spawns `npm publish`, whose bundled deps load the
        # deprecated `punycode` core module → a DEP0040 line we cannot action
        # (it is npm-internal, not anodizer code). Silence only that code so
        # genuine deprecations in any child still surface. Requires node >=
        # 21.3 for the per-code flag; the npm path provisions node >= 22.14.
        NODE_OPTIONS: --disable-warning=DEP0040
      run: "${GITHUB_ACTION_PATH}/scripts/run/anodizer.sh"

    # -------------------------------------------------------------------------
    # Outputs
    # -------------------------------------------------------------------------
    # always(): outputs must be collected even when "Run anodizer" fails —
    # the `irreversibly_published` output exists precisely so a FAILED
    # release run can tell its workflow whether a one-way-door publisher
    # already burned the version before any rollback fires. Default
    # success() gating here would skip this step on failure and leave
    # `irreversibly_published` empty, which a rollback gate reads as
    # "nothing burned".
    - name: Collect outputs
      if: always() && steps.plan.outputs.run_anodizer == 'true'
      id: outputs
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ANODIZER_STDOUT_LOG: ${{ runner.temp }}/anodizer-stdout.log
      run: "${GITHUB_ACTION_PATH}/scripts/run/outputs.sh"

    # -------------------------------------------------------------------------
    # Build provenance (SLSA) — when anodizer ran in the default `subjects`
    # attestation mode it left dist/[<crate>.]attestation-subjects.json. Flatten
    # those subjects into a checksums file and mint a GitHub-trusted, OIDC-backed
    # SLSA attestation over them; anodizer itself never holds an attestation key.
    # Producing the manifest is the opt-in, so consumers only set
    # `attestations.enabled` in their config — the caller must additionally grant
    # `id-token: write` and `attestations: write`.
    # -------------------------------------------------------------------------
    - name: Collect attestation subjects
      if: steps.plan.outputs.run_anodizer == 'true'
      id: attest-subjects
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: "${GITHUB_ACTION_PATH}/scripts/run/attest-subjects.sh"

    - name: Attest build provenance
      if: steps.attest-subjects.outputs.checksums != ''
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: ${{ steps.attest-subjects.outputs.checksums }}

    # -------------------------------------------------------------------------
    # Upload split artifacts (for split build jobs). With preserve-dist the
    # harness's byte-stable tree under preserved-dist/ is what downstream
    # publish jobs need, and the per-shard label keeps same-OS shards from
    # colliding on the artifact name.
    # -------------------------------------------------------------------------
    - name: Upload split artifacts
      if: inputs.upload-dist == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.preserve-dist == 'true' && format('dist-{0}', inputs.shard-label) || format('dist-{0}', runner.os) }}
        path: ${{ inputs.preserve-dist == 'true' && format('{0}/preserved-dist/', inputs.workdir) || format('{0}/', steps.dist.outputs.path) }}
        # The dist tree carries dot-directories (.completions/, .manpages/)
        # that the preserved context manifest lists as artifacts; the
        # upload action's v4+ default excludes hidden files, which silently
        # strips them and fails `release --publish-only`'s hash-verify on
        # the download side.
        include-hidden-files: true
